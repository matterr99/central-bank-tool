<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G10 Policy Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020203; color: #d4d4d8; font-family: 'Inter', sans-serif; }
        .macro-panel {
            background: linear-gradient(180deg, #0e111a 0%, #07080e 100%);
            border: 1px solid rgba(82, 82, 91, 0.5);
            box-shadow: 0 20px 48px -4px rgba(0, 0, 0, 0.95), 0 0 32px 1px rgba(6, 182, 212, 0.16);
        }
    </style>
</head>
<body class="bg-[#020203] text-zinc-300 antialiased min-h-screen flex flex-col p-4 sm:p-8">

    <!-- Simple Top Bar -->
    <div class="max-w-6xl mx-auto w-full flex justify-between items-center mb-8">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-cyan-500 animate-pulse"></span>
            <span class="font-mono text-[10px] text-cyan-500 tracking-[0.2em] uppercase">Render Compute Node</span>
        </div>
        <a href="https://matterr99.github.io/kairos-macro-trading-hub/" class="px-4 py-1.5 bg-cyan-950/40 hover:bg-cyan-900/60 text-cyan-400 border border-cyan-800/60 font-mono text-[10px] uppercase tracking-wider transition">
            &larr; Back to Hub
        </a>
    </div>

    <!-- Matrix Table Container -->
    <div class="max-w-6xl mx-auto w-full macro-panel p-5 sm:p-6 space-y-5">
        <div class="flex justify-between items-end border-b border-zinc-900 pb-4">
            <div>
                <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2 font-mono">
                    <span class="text-cyan-400">🏛</span> G10 POLICY RATE EXPECTATIONS MATRIX
                </h3>
                <p class="text-[11px] text-zinc-500 mt-1">Live data synced via secure FRED proxy.</p>
            </div>
            <button onclick="loadData()" id="refreshBtn" class="text-[10px] text-cyan-400 uppercase tracking-widest font-bold bg-cyan-950/40 px-3 py-1.5 border border-cyan-800/50 hover:bg-cyan-900/60 transition">
                Sync Data
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left font-mono text-xs min-w-[760px]">
                <thead>
                    <tr class="text-zinc-500 text-[10px] border-b border-zinc-900 uppercase tracking-wider bg-[#07080d]">
                        <th class="p-3.5 pl-4">Next Decision</th>
                        <th class="p-3.5">Central Bank</th>
                        <th class="p-3.5 text-center">Benchmark Rate</th>
                        <th class="p-3.5 text-center">Implied Forward</th>
                        <th class="p-3.5 text-center">Delta (bps)</th>
                        <th class="p-3.5 text-center">Move Probability</th>
                        <th class="p-3.5 text-center">Evaluated Policy Tone</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-zinc-900/60">
                    <!-- Rows will be injected here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const banks = [
            { code: 'ECB', name: 'European Central Bank (ECB)', series: 'IRSTCB01EZM156N', fallback: 2.40, meeting: '2026-10-22', step: 0.25, offset: 0.23 },
            { code: 'BOC', name: 'Bank of Canada (BOC)', series: 'IRSTCB01CAM156N', fallback: 2.25, meeting: '2026-10-28', step: 0.25, offset: 0.08 },
            { code: 'BOJ', name: 'Bank of Japan (BOJ)', series: 'IRSTCB01JPM156N', fallback: 1.00, meeting: '2026-10-30', step: 0.10, offset: 0.20 },
            { code: 'RBA', name: 'Reserve Bank of Australia (RBA)', series: 'IRSTCB01AUM156N', fallback: 4.35, meeting: '2026-11-03', step: 0.25, offset: 0.18 },
            { code: 'FED', name: 'Federal Reserve (FED)', series: 'DFF', fallback: 3.63, meeting: '2026-11-04', step: 0.25, offset: 0.15 },
            { code: 'BOE', name: 'Bank of England (BOE)', series: 'IRSTCB01GBM156N', fallback: 3.75, meeting: '2026-11-05', step: 0.25, offset: 0.12 },
            { code: 'RBNZ', name: 'Reserve Bank of NZ (RBNZ)', series: 'IRSTCB01NZM156N', fallback: 2.50, meeting: '2026-11-25', step: 0.25, offset: 0.14 },
            { code: 'SNB', name: 'Swiss National Bank (SNB)', series: 'IRSTCB01CHM156N', fallback: 0.00, meeting: '2026-12-10', step: 0.25, offset: 0.05 }
        ];

        function getTone(deltaBps, outcome) {
            if (deltaBps >= 20) return { label: 'Strongly Hawkish', color: 'text-emerald-300 bg-emerald-950/80 border-emerald-500/50' };
            if (deltaBps > 5 || (outcome === 'HIKE' && deltaBps >= 10)) return { label: 'Hawkish Bias', color: 'text-emerald-400 bg-emerald-950/50 border-emerald-500/30' };
            if (outcome === 'HOLD' && deltaBps > 5) return { label: 'Hawkish Hold', color: 'text-teal-300 bg-teal-950/50 border-teal-500/30' };
            if (Math.abs(deltaBps) <= 5) return { label: 'Data-Dependent', color: 'text-zinc-300 bg-zinc-800/60 border-zinc-700' };
            if (outcome === 'HOLD' && deltaBps < -5) return { label: 'Dovish Hold', color: 'text-amber-300 bg-amber-950/50 border-amber-500/30' };
            if (deltaBps <= -20) return { label: 'Strongly Dovish', color: 'text-rose-400 bg-rose-950/80 border-rose-500/50' };
            return { label: 'Dovish Pivot', color: 'text-rose-300 bg-rose-950/50 border-rose-500/30' };
        }

        async function loadData() {
            const tbody = document.getElementById('tableBody');
            const btn = document.getElementById('refreshBtn');
            btn.innerText = 'SYNCING...';
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-10 text-zinc-500">Connecting to secure proxy...</td></tr>';

            let html = '';

            for (const bank of banks) {
                let rate = bank.fallback;
                let isLive = false;

                try {
                    const res = await fetch(`/api/fred?series_id=${bank.series}`);
                    if (res.ok) {
                        const data = await res.json();
                        const valid = data.observations.filter(o => o.value && o.value !== '.');
                        if (valid.length > 0) {
                            rate = parseFloat(valid[0].value);
                            isLive = true;
                        }
                    }
                } catch (e) {
                    console.error('Failed to fetch', bank.code);
                }

                const implied = rate + bank.offset;
                const deltaBps = (implied - rate) * 100;
                const prob = Math.min(100, Math.round((Math.abs(deltaBps) / (bank.step * 100)) * 100));
                const outcome = deltaBps > bank.step * 50 ? 'HIKE' : deltaBps < -bank.step * 50 ? 'CUT' : 'HOLD';
                const tone = getTone(deltaBps, outcome);
                
                const deltaColor = deltaBps > 0 ? 'text-emerald-400' : deltaBps < 0 ? 'text-rose-400' : 'text-zinc-400';
                const barColor = outcome === 'HIKE' ? 'bg-emerald-500' : outcome === 'CUT' ? 'bg-rose-500' : 'bg-cyan-500';
                
                // Countdown Logic
                const diffDays = Math.ceil((new Date(bank.meeting) - new Date()) / (1000 * 60 * 60 * 24));
                const badge = diffDays <= 0 ? '<span class="bg-zinc-900 text-zinc-500 border border-zinc-800 px-1.5 py-0.5 rounded text-[9px]">PASSED</span>' :
                              diffDays <= 7 ? `<span class="bg-rose-950/80 text-rose-300 border border-rose-800 px-1.5 py-0.5 rounded text-[9px] animate-pulse">${diffDays}D LEFT</span>` :
                              `<span class="bg-cyan-950/50 text-cyan-300 border border-cyan-800/60 px-1.5 py-0.5 rounded text-[9px]">${diffDays}D LEFT</span>`;

                html += `
                    <tr class="hover:bg-[#0c0c16] transition-colors">
                        <td class="p-3.5 pl-4 text-zinc-300 font-bold flex items-center gap-2">
                            ${bank.meeting} ${badge}
                        </td>
                        <td class="p-3.5 font-bold text-white">
                            <div class="flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full ${isLive ? 'bg-emerald-400' : 'bg-zinc-600'}"></span>
                                ${bank.name}
                            </div>
                        </td>
                        <td class="p-3.5 text-center text-zinc-200 tabular-nums">${rate.toFixed(2)}%</td>
                        <td class="p-3.5 text-center text-cyan-400 font-bold tabular-nums">${implied.toFixed(2)}%</td>
                        <td class="p-3.5 text-center font-bold tabular-nums ${deltaColor}">${deltaBps > 0 ? '+' : ''}${deltaBps.toFixed(1)}</td>
                        <td class="p-3.5 text-center tabular-nums">
                            <div class="flex flex-col items-center gap-1 w-24 mx-auto">
                                <span class="font-bold text-zinc-200">${prob}% <span class="text-[9px] text-zinc-500">${outcome}</span></span>
                                <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden">
                                    <div class="h-full ${barColor}" style="width: ${prob}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="p-3.5 text-center">
                            <span class="px-2.5 py-1 text-[10px] font-bold border tracking-wide inline-block ${tone.color}">${tone.label}</span>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;
            btn.innerText = 'SYNC DATA';
        }

        // Load data on start
        loadData();
    </script>
</body>
</html>
