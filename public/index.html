<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUSTOM TOOL // KAIROS GLOBAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020203; color: #d4d4d8; font-family: 'Inter', sans-serif; }
        .macro-panel {
            background: linear-gradient(180deg, #0e111a 0%, #07080e 100%);
            border: 1px solid rgba(82, 82, 91, 0.5);
            box-shadow: 0 20px 48px -4px rgba(0, 0, 0, 0.95), 0 0 32px 1px rgba(6, 182, 212, 0.16), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="bg-[#020203] text-zinc-300 antialiased min-h-screen flex flex-col">

    <!-- HEADER WITH RETURN BUTTON -->
    <header class="w-full bg-[#040406]/90 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 shrink-0 border-2 border-cyan-500 flex items-center justify-center">
                    <span class="w-3 h-3 bg-cyan-500 animate-pulse"></span>
                </div>
                <div class="flex flex-col">
                    <span class="font-black tracking-widest text-white uppercase leading-none text-base">KAIROS GLOBAL</span>
                    <span class="font-mono text-[9px] text-cyan-500 tracking-[0.2em] uppercase mt-1">Render Compute Node</span>
                </div>
            </div>
            
            <!-- BUTTON BACK TO HUB -->
            <a href="https://matterr99.github.io/kairos-macro-trading-hub/" class="px-4 py-2 bg-cyan-950/40 hover:bg-cyan-900/60 text-cyan-400 border border-cyan-800/60 transition font-bold font-mono text-[10px] sm:text-xs uppercase tracking-wider flex items-center gap-2">
                &larr; Back to Hub
            </a>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto px-4 py-12 space-y-8">
        <div class="space-y-2 border-b border-zinc-900 pb-6">
            <span class="text-cyan-500 font-mono text-[10px] font-bold uppercase tracking-[0.25em]">// LIVE DATA ENGINE</span>
            <h1 class="text-3xl font-black text-white uppercase tracking-tight">FRED API Tool</h1>
        </div>

        <div class="macro-panel p-6 sm:p-8 space-y-6">
            <div class="flex flex-col sm:flex-row gap-4 font-mono text-xs">
                <input type="text" id="seriesInput" placeholder="Enter FRED Series ID (e.g. DFF, DGS10)" value="DFF" class="flex-grow bg-[#10121a] border border-zinc-700/60 focus:border-cyan-500 text-white p-3.5 outline-none uppercase" />
                <button onclick="fetchData()" class="bg-cyan-500 hover:bg-cyan-400 text-black px-8 py-3.5 font-bold uppercase tracking-wider transition cursor-pointer">
                    Fetch Data
                </button>
            </div>

            <!-- Output Display -->
            <div class="bg-[#020203] border border-zinc-800 p-4 min-h-[200px] overflow-auto">
                <pre id="output" class="text-[10px] sm:text-xs text-zinc-400 font-mono">System standing by. Enter a series ID and execute fetch...</pre>
            </div>
        </div>
    </main>

    <script>
        async function fetchData() {
            const output = document.getElementById('output');
            const seriesId = document.getElementById('seriesInput').value.trim();
            
            if (!seriesId) return;
            output.innerText = "Querying secure backend proxy...";
            
            try {
                // Calls your OWN server.js proxy, NOT FRED directly
                const response = await fetch(`/api/fred?series_id=${seriesId}`);
                const data = await response.json();
                
                if (response.ok) {
                    output.innerHTML = `<span class="text-emerald-400">SUCCESS: Retrieved ${data.observations.length} observations for ${seriesId}</span>\n\n` + JSON.stringify(data.observations, null, 2);
                } else {
                    output.innerHTML = `<span class="text-rose-400">ERROR: ${data.error || 'Failed to fetch data'}</span>`;
                }
            } catch (err) {
                output.innerHTML = `<span class="text-rose-400">SYSTEM FAULT: Cannot connect to backend.</span>`;
            }
        }
    </script>
</body>
</html>
